name: AlgoGenesis tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install external Z3 proof oracle (Python 3.13 only)
        if: matrix.python-version == '3.13'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
          command -v z3
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test exact sorting network
        run: python discovery.py --mode exact --width 4
      - name: Smoke-test dynamic synthesis
        run: python dynamic_synthesis.py
      - name: Independently verify four pinned SyGuS candidates
        if: matrix.python-version == '3.13'
        run: python sygus_smt_bridge.py --all --solver z3 --timeout 30
