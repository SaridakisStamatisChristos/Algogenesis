name: AlgoGenesis tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test exact sorting network
        run: python discovery.py --mode exact --width 4
      - name: Smoke-test dynamic synthesis
        run: python dynamic_synthesis.py
