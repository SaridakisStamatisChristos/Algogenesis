name: AlgoGenesis tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install external Z3 proof oracle (Python 3.13 only)
        if: matrix.python-version == '3.13'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y z3
          command -v z3
      - name: Install optional cvc5 SyGuS comparison engine
        if: matrix.python-version == '3.13'
        run: |
          if apt-cache show cvc5 >/dev/null 2>&1; then
            sudo apt-get install -y cvc5
            cvc5 --version
          else
            echo "cvc5 package unavailable: benchmark will record UNAVAILABLE"
          fi
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test exact sorting network
        run: python discovery.py --mode exact --width 4
      - name: Smoke-test dynamic synthesis
        run: python dynamic_synthesis.py
      - name: Discover six-wire parallel sorting algorithm and independently verify
        if: matrix.python-version == '3.13'
        run: python algorithm_invention_v29.py --width 6 --stages 5 --comparators 12 --beam 256 --output invention_v29_width6.json
      - name: Publish raw v2.9 algorithm invention artifact
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: algogenesis-v29-algorithm-invention
          path: invention_v29_width6.json
          if-no-files-found: warn
      - name: Generate four typed genome algorithms with independent test gates
        if: matrix.python-version == '3.13'
        run: |
          set -e
          for task in contains count sum clamp; do
            python algorithm_genome_v30.py --task "$task" --output "v30_$task.json" > /dev/null
          done
          python - <<'PY'
          import json
          for task in ('contains','count','sum','clamp'):
              r=json.load(open('v30_' + task + '.json', encoding='utf-8'))
              assert r['status']=='empirically_validated' and r['heldout_cases']==51
              assert r['genome'] is not None
              print(task, r['candidate_count'],
                    r['mean_comparisons'], r['mean_array_writes'])
          PY
      - name: Publish v3.0 typed genome source-result evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: algogenesis-v30-typed-genome
          path: v30_*.json
          if-no-files-found: error
      - name: Evolve four typed algorithm genomes with independent heldout gate
        if: matrix.python-version == '3.13'
        run: |
          set -e
          for task in count contains sum clamp; do
            python genome_evolution_v31.py --task "$task" --output "v31_$task.json" > /dev/null
          done
          python - <<'PY'
          import json
          records={t:json.load(open('v31_'+t+'.json',encoding='utf-8'))
                   for t in ('count','contains','sum','clamp')}
          count=records['count']
          before=count['heldout']['base']
          after=count['heldout']['evolved']
          assert count['status']=='empirically_validated'
          assert count['heldout']['cases']==51
          assert after[0]==before[0] and after[2]<before[2]*0.90
          assert any('predicate-increment-to-branch' in h['rule']
                     for h in count['history'])
          contains=records['contains']
          assert contains['fitness']['evolved'][0]<contains['fitness']['base'][0]
          assert contains['heldout']['evolved'][0]==contains['heldout']['base'][0]
          for task in ('sum','clamp'):
              assert records[task]['status']=='no_fitness_improvement'
          for task,record in records.items():
              assert record['heldout']['cases']==51
              assert record['finite_scope_only'] and not record['global_novelty_claim']
              print(task,record['status'],record['heldout'])
          PY
      - name: Publish raw v3.1 structural evolution artifacts
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: algogenesis-v31-genome-evolution
          path: v31_*.json
          if-no-files-found: error
      - name: Compose and fuse four newly generated two-pass algorithms
        if: matrix.python-version == '3.13'
        run: |
          set -e
          for task in count_max count_min sum_max sum_min; do
            python genome_crossover_v32.py --task "$task" --output "v32_two_$task.json" > /dev/null
            python genome_fusion_v32.py --task "$task" --output "v32_fused_$task.json" > /dev/null
          done
          python - <<'PY'
          import json
          for task in ('count_max','count_min','sum_max','sum_min'):
              a=json.load(open('v32_two_'+task+'.json',encoding='utf-8'))
              b=json.load(open('v32_fused_'+task+'.json',encoding='utf-8'))
              assert a['status']==b['status']=='empirically_validated'
              assert a['heldout_cases']==51 and a['prefix_candidates']==408
              assert a['accepted_compositions']>0 and b['correct_candidates']>0
              assert b['fused_heldout'][0]<b['two_pass_heldout'][0]
              assert b['fused_heldout'][1]<b['two_pass_heldout'][1]
              # Negative SOTA gate: do not suppress the stronger known algorithm.
              assert b['fused_heldout'][0]>b['strong_one_pass_reference_comparisons']
              assert not b['sota_claim'] and not a['global_sota_claim']
              print(task,'two',a['heldout'],'fused',b['fused_heldout'],
                    'one_pass_reference',b['strong_one_pass_reference_comparisons'])
          PY
      - name: Publish raw v3.2 compositional invention evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: algogenesis-v32-composition-and-fusion
          path: v32_*.json
          if-no-files-found: error
      - name: Generate and falsify four v3.3 head-tail one-pass algorithms
        if: matrix.python-version == '3.13'
        run: |
          set -e
          for task in count_max count_min sum_max sum_min; do
            python genome_headtail_v33.py --task "$task" --output "v33_$task.json" > /dev/null
          done
          python - <<'PY'
          import json
          for task in ('count_max','count_min','sum_max','sum_min'):
              record=json.load(open('v33_'+task+'.json',encoding='utf-8'))
              assert record['status']=='empirically_validated'
              assert record['generated_candidates']==768
              assert record['correct_training_validation']>0
              assert record['heldout_cases']==51
              assert record['heldout_only_for_reporting']
              assert record['heldout_operations'][0]<record['v32_fused_comparisons']
              assert record['heldout_operations'][1]<record['v32_fused_steps']
              assert record['heldout_operations'][0]<=record['strong_one_pass_reference_comparisons']*1.15
              assert not record['global_sota_claim']
              assert not record['universal_formal_verification']
              print(task, record['heldout_operations'],
                    record['strong_one_pass_reference_comparisons'])
          PY
      - name: Upload v3.3 one-pass generation research evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: algogenesis-v33-headtail
          path: v33_*.json
          if-no-files-found: error
      - name: Independently verify four pinned SyGuS candidates
        if: matrix.python-version == '3.13'
        run: python sygus_smt_bridge.py --all --solver z3 --timeout 30
      - name: Run v2.8 frozen 12-task comparison and independent proof gate
        if: matrix.python-version == '3.13'
        run: python benchmark_v27.py --timeout 5 --z3-timeout 15 --repeats 3 --output benchmark_v28_results.json --require-proved max5.sl,max6.sl,max7.sl,max8.sl,max16.sl,small.sl,VC22_a.sl,VC22_b.sl
      - name: Publish raw v2.8 benchmark results
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: algogenesis-v28-12case-comparison
          path: benchmark_v28_results.json
          if-no-files-found: warn
